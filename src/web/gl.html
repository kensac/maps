<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Material 3 tokens (baseline scheme). */
  :root {
    --primary: #3a608f; --on-primary: #fff;
    --secondary-container: #d8e3f8; --on-secondary-container: #111c2b;
    --surface: #f9f9ff; --surface-container: #eceef4; --surface-container-high: #e7e8ee;
    --on-surface: #191c20; --on-surface-variant: #43474e; --outline-variant: #c3c6cf;
    --scrim: rgba(0, 0, 0, .32); --bg: #e9e5dc;
    --elevation-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
    --elevation-3: 0 1px 3px rgba(0,0,0,.3), 0 4px 8px 3px rgba(0,0,0,.15);
  }
  :root[data-theme="dark"] {
    --primary: #a4c9fe; --on-primary: #00315d;
    --secondary-container: #3c4758; --on-secondary-container: #d8e3f8;
    --surface: #111318; --surface-container: #1d2024; --surface-container-high: #282a2f;
    --on-surface: #e1e2e8; --on-surface-variant: #c3c6cf; --outline-variant: #43474e;
    --bg: #12151b;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font: 400 14px/20px Roboto, system-ui, sans-serif; color: var(--on-surface);
    -webkit-user-select: none; user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  svg { width: 24px; height: 24px; fill: currentColor; display: block; }

  /* Buttons share a state layer: 8% on hover, 12% when pressed. */
  .btn { position: relative; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center;
    font: 500 14px/20px Roboto, system-ui, sans-serif; letter-spacing: .1px; -webkit-tap-highlight-color: transparent; }
  .btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0;
    transition: opacity 120ms; }
  .btn:hover::after { opacity: .08; } .btn:active::after { opacity: .12; }
  .btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .fab { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-container-high);
    color: var(--primary); box-shadow: var(--elevation-3); }
  .tonal { width: 40px; height: 40px; border-radius: 20px; background: var(--secondary-container);
    color: var(--on-secondary-container); box-shadow: var(--elevation-1); }
  .icon { width: 40px; height: 40px; border-radius: 20px; background: transparent; color: var(--on-surface-variant); }
  .text-btn { height: 40px; padding: 0 12px; border-radius: 20px; background: transparent; color: var(--primary); }

  .controls { position: absolute; right: 16px; bottom: 32px; display: flex; flex-direction: column;
    align-items: center; gap: 12px; z-index: 2; }
  .zoom { display: flex; flex-direction: column; border-radius: 20px; background: var(--surface-container-high);
    box-shadow: var(--elevation-3); overflow: hidden; }
  .zoom .icon { border-radius: 0; }
  .top { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; z-index: 2; }
  #compass svg { transition: transform 60ms linear; }
  .attribution { position: absolute; right: 8px; bottom: 6px; font-size: 11px; line-height: 16px; z-index: 2;
    color: var(--on-surface-variant); }
  .attribution a { color: inherit; }

  /* Linear progress, indeterminate. */
  .progress { position: absolute; top: 0; left: 0; right: 0; height: 4px; overflow: hidden; z-index: 3;
    background: var(--secondary-container); visibility: hidden; }
  .progress::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--primary);
    animation: slide 1.2s cubic-bezier(.4, 0, .2, 1) infinite; }
  @keyframes slide { from { left: -40%; } to { left: 100%; } }

  /* Dialog. */
  .scrim { position: fixed; inset: 0; background: var(--scrim); display: none; place-items: center; z-index: 4; }
  .scrim.open { display: grid; }
  .dialog { min-width: 280px; max-width: 560px; padding: 24px; border-radius: 28px; background: var(--surface-container-high);
    box-shadow: var(--elevation-3); }
  .dialog h2 { margin: 0 0 16px; font: 400 24px/32px Roboto, system-ui, sans-serif; }
  .row { display: flex; justify-content: space-between; gap: 32px; padding: 8px 0; }
  .row span:last-child { color: var(--on-surface-variant); }
  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div class="progress" id="progress"></div>

<div class="top">
  <button class="btn tonal" id="theme" title="Dark theme" aria-label="Dark theme">
    <svg viewBox="0 0 24 24" id="themeIcon"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>
  <button class="btn tonal" id="help" title="Controls" aria-label="Controls">
    <svg viewBox="0 0 24 24"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg>
  </button>
</div>

<div class="controls">
  <button class="btn fab" id="compass" title="Face north" aria-label="Face north">
    <svg viewBox="0 0 24 24"><path d="M12 2 6 12h12z"/><path d="M12 22 6 12h12z" opacity=".35"/></svg>
  </button>
  <button class="btn fab" id="tilt" title="Tilt" aria-label="Tilt"><span id="tiltLabel">2D</span></button>
  <div class="zoom">
    <button class="btn icon" id="zin" title="Zoom in" aria-label="Zoom in">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
    <button class="btn icon" id="zout" title="Zoom out" aria-label="Zoom out">
      <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
    </button>
  </div>
</div>
<div class="attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>

<div class="scrim" id="helpDialog">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <h2 id="helpTitle">Controls</h2>
    <div class="row"><span>Move</span><span>Drag</span></div>
    <div class="row"><span>Zoom</span><span>Scroll or pinch</span></div>
    <div class="row"><span>Rotate and tilt</span><span>Right drag or Ctrl drag</span></div>
    <div class="row"><span>Rotate on touch</span><span>Twist two fingers</span></div>
    <div class="row"><span>Tilt on touch</span><span>Drag two fingers up or down</span></div>
    <div class="row"><span>Face north</span><span>N</span></div>
    <div class="actions"><button class="btn text-btn" id="helpClose">Close</button></div>
  </div>
</div>

<script type="module">
"use strict";
const meta = await (await fetch("meta.json")).json();
const MAX_GEO = meta.geoMaxZoom, MAX_PITCH = 60, FOV = 0.6435;
const canvas = document.getElementById("map");
const gl = canvas.getContext("webgl2", { antialias: true, alpha: false });
const $ = (id) => document.getElementById(id);
const rad = (d) => d * Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Web Mercator, normalized: x east, y south, both 0..1.
const project = (lon, lat) => {
  const s = Math.sin(rad(clamp(lat, -85.05, 85.05)));
  return [(lon + 180) / 360, 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)];
};
const unproject = (x, y) => [x * 360 - 180, Math.atan(Math.sinh(Math.PI * (1 - 2 * y))) * 180 / Math.PI];
const metersPerUnit = (y) => 40075016.686 * Math.cos(rad(unproject(0.5, y)[1]));
const [bx0, by0] = project(meta.bounds[0], meta.bounds[3]);
const [bx1, by1] = project(meta.bounds[2], meta.bounds[1]);

// ---- Camera ---------------------------------------------------------------
// Zoom uses 256 px tiles; the center may sit anywhere within the data
// bounds padded by a quarter of their size, so edges can be centered.
const view = { x: (bx0 + bx1) / 2, y: (by0 + by1) / 2, z: 12, bearing: 0, pitch: 45 };
let W = 1, H = 1, DPR = 1;
const fitZoom = () => Math.log2(Math.min(W / ((bx1 - bx0) * 256), H / ((by1 - by0) * 256)));
const minZoom = () => Math.max(1, fitZoom() - 1);
function constrain() {
  view.z = clamp(view.z, minZoom(), 22);
  view.pitch = clamp(view.pitch, 0, MAX_PITCH);
  view.bearing = ((view.bearing % 360) + 360) % 360;
  const px = (bx1 - bx0) * 0.25, py = (by1 - by0) * 0.25;
  view.x = clamp(view.x, bx0 - px, bx1 + px);
  view.y = clamp(view.y, by0 - py, by1 + py);
}
function readHash() {
  const p = location.hash.slice(1).split("/").map(Number);
  if (p.length < 3 || !p.every(Number.isFinite)) return false;
  [view.x, view.y] = project(p[2], p[1]);
  view.z = p[0]; view.bearing = p[3] || 0; view.pitch = p.length > 4 ? p[4] : 45;
  return true;
}

// The camera looks at the view center from distance D (pixels), tilted by
// pitch and turned by bearing. World units are pixels at the current zoom,
// relative to the center: x east, y south, z up.
let D = 1, rot = null, proj = null;
function setupCamera() {
  D = 0.5 * H / Math.tan(FOV / 2);
  const b = rad(view.bearing), p = rad(view.pitch);
  const cb = Math.cos(b), sb = Math.sin(b), cp = Math.cos(p), sp = Math.sin(p);
  // rot: world -> camera (before the -D translation), row-major 3x3.
  rot = [cb, sb, 0, sb * cp, -cb * cp, sp, -sb * sp, cb * sp, cp];
  const near = D * 0.01, far = D * 40;
  const A = -(far + near) / (far - near), B = -2 * far * near / (far - near);
  const sx = 2 * D / W, sy = 2 * D / H;
  const r = rot;
  // clip = P * (rot * w + [0, 0, -D]); column-major 4x4.
  proj = new Float32Array([
    sx * r[0], sy * r[3], A * r[6], -r[6],
    sx * r[1], sy * r[4], A * r[7], -r[7],
    sx * r[2], sy * r[5], A * r[8], -r[8],
    0, 0, -A * D + B, D,
  ]);
}
const worldSize = () => 256 * 2 ** view.z;
// Camera position in world pixels (relative to the center).
function cameraPos() {
  const r = rot; // inverse rotation is the transpose; camera is at R^T (0,0,D)
  return [r[6] * D, r[7] * D, r[8] * D];
}
// Screen point -> ground point (normalized world), or null above the horizon.
function screenToGround(sx, sy) {
  const dir = [(sx - W / 2) / D, -(sy - H / 2) / D, -1];
  const r = rot, c = cameraPos();
  const d = [r[0] * dir[0] + r[3] * dir[1] + r[6] * dir[2],
             r[1] * dir[0] + r[4] * dir[1] + r[7] * dir[2],
             r[2] * dir[0] + r[5] * dir[1] + r[8] * dir[2]];
  if (d[2] >= -1e-6) return null;
  const t = -c[2] / d[2];
  const ws = worldSize();
  return [view.x + (c[0] + d[0] * t) / ws, view.y + (c[1] + d[1] * t) / ws];
}

// ---- GL programs ----------------------------------------------------------
function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, "#version 300 es\nprecision highp float;\n" + src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}
// u_tile: offset x, offset y (world px), tile size (px), pixels per meter.
// Positions arrive as i16 in 1/8192 tile, heights in 1/20 m.
const COMMON = `
uniform mat4 u_proj; uniform vec4 u_tile; uniform vec3 u_cam; uniform vec2 u_fog;
out float v_fog;
vec3 world(vec3 q) { return vec3(u_tile.xy + q.xy / 8192.0 * u_tile.z, q.z / 20.0 * u_tile.w); }
vec4 place(vec3 p) { v_fog = smoothstep(u_fog.x, u_fog.y, distance(p, u_cam)); return u_proj * vec4(p, 1.0); }`;
const FOG = `uniform vec3 u_bg; in float v_fog; vec4 fog(vec4 c) { return vec4(mix(c.rgb, u_bg, v_fog), c.a); }`;
const LIGHT = `
const vec3 SUN = normalize(vec3(-0.55, 0.3, 0.78));
float lit(vec3 n) { return 0.6 + 0.4 * max(dot(normalize(n), SUN), 0.0); }`;

const fillProg = program(`${COMMON}
layout(location=0) in vec2 a_uv; layout(location=1) in vec4 a_color;
out vec4 v_color;
void main() { gl_Position = place(world(vec3(a_uv, 0.0))); v_color = a_color; }`,
`${FOG} in vec4 v_color; out vec4 o; void main() { o = fog(v_color); }`);

const lineProg = program(`${COMMON}
layout(location=0) in vec3 a_pos; layout(location=1) in vec2 a_normal;
layout(location=2) in float a_dist; layout(location=3) in float a_width;
layout(location=5) in vec4 a_color; layout(location=6) in vec2 a_dash;
out vec4 v_color; out float v_dist; out vec2 v_dash;
void main() {
  float half_px = max(a_width / 100.0 * u_tile.w, 0.75) * 0.5;
  vec3 p = world(a_pos);
  p.xy += a_normal / 64.0 * half_px;
  gl_Position = place(p);
  v_color = a_color; v_dist = a_dist; v_dash = a_dash / 10.0;
}`,
`${FOG} in vec4 v_color; in float v_dist; in vec2 v_dash; out vec4 o;
void main() {
  if (v_dash.x > 0.0 && mod(v_dist, v_dash.x + v_dash.y) > v_dash.x) discard;
  o = fog(v_color);
}`);

const meshProg = program(`${COMMON}
layout(location=0) in vec3 a_pos;
layout(location=2) in vec4 a_color; layout(location=3) in float a_floor;
layout(location=4) in float a_base; layout(location=5) in float a_seed;
out vec4 v_color; out vec3 v_p; out vec3 v_win; out float v_z; out vec2 v_xy;
void main() {
  v_p = world(a_pos);
  gl_Position = place(v_p);
  v_color = a_color; v_z = a_pos.z / 20.0;
  v_win = vec3(a_floor / 10.0, a_base / 10.0, a_seed);
  v_xy = a_pos.xy / 8192.0 * (u_tile.z / max(u_tile.w, 1e-6)); // meters within the tile
}`,
`${LIGHT}
${FOG}
uniform float u_night; uniform vec3 u_cam;
in vec4 v_color; in vec3 v_p; in vec3 v_win; in float v_z; in vec2 v_xy; out vec4 o;
float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
void main() {
  // Flat normal from screen derivatives, turned toward the camera.
  vec3 n = normalize(cross(dFdx(v_p), dFdy(v_p)));
  if (dot(n, u_cam - v_p) < 0.0) n = -n;
  bool night = u_night > 0.5;
  vec3 c = v_color.rgb;
  float glow = 0.0;
  // Roofs a touch lighter at night so silhouettes read.
  if (night && n.z > 0.5) c = mix(c, vec3(0.62, 0.66, 0.74), 0.35);
  // Windows: a band per floor on walls, faded out once smaller than a pixel.
  if (v_win.x > 0.0 && abs(n.z) < 0.5) {
    float f = (v_z - v_win.y) / v_win.x;
    float fade = 1.0 - smoothstep(0.25, 0.5, fwidth(f));
    float band = step(0.32, fract(f)) * step(fract(f), 0.78) * fade;
    vec3 glass = night ? vec3(0.08, 0.10, 0.14) : vec3(0.49, 0.58, 0.64);
    c = mix(c, glass, band * (night ? 0.45 : 0.42));
    if (night && band > 0.0 && hash(vec3(floor(f), floor(v_xy / 4.0)) + v_win.z) < 0.16)
      glow = band * 0.85;
  }
  // Harder sun at night: lit faces stand apart from shaded ones.
  float d = max(dot(n, SUN), 0.0);
  float shade = night ? 0.42 + 0.7 * d : 0.6 + 0.4 * d;
  // Lit windows glow whatever way the wall faces.
  o = fog(vec4(mix(c * shade, vec3(0.88, 0.72, 0.46), glow), v_color.a));
}`);

const instProg = program(`${COMMON}
layout(location=0) in vec3 a_pos; layout(location=1) in vec3 a_normal; layout(location=2) in vec4 a_color;
layout(location=3) in vec4 a_inst; layout(location=4) in float a_scale;
out vec4 v_color; out vec3 v_normal;
void main() {
  // Models face south; turn them to their heading.
  float a = a_inst.w - 3.14159265;
  mat2 r = mat2(cos(a), sin(a), -sin(a), cos(a));
  vec2 xy = r * a_pos.xy;
  vec3 base = vec3(u_tile.xy + a_inst.xy * u_tile.z, a_inst.z * u_tile.w);
  gl_Position = place(base + vec3(xy, a_pos.z * a_scale) * u_tile.w);
  v_color = a_color; v_normal = vec3(r * a_normal.xy, a_normal.z);
}`,
`${LIGHT}
${FOG}
in vec4 v_color; in vec3 v_normal; out vec4 o;
void main() { o = fog(vec4(v_color.rgb * lit(v_normal), v_color.a)); }`);

// ---- Tiles ----------------------------------------------------------------
const tiles = new Map();          // key -> tile record
let theme = "light", templates = null, generation = 0;
const key = (z, x, y) => `${z}/${x}/${y}`;

function vao(setup) {
  const v = gl.createVertexArray();
  gl.bindVertexArray(v);
  const bufs = setup();
  gl.bindVertexArray(null);
  return { vao: v, bufs };
}
function buffer(target, data) {
  const b = gl.createBuffer();
  gl.bindBuffer(target, b);
  gl.bufferData(target, data, gl.STATIC_DRAW);
  return b;
}
// Interleaved attributes: [location, size, type, normalized, offset]*.
function attribs(stride, list, divisor = 0) {
  for (const [loc, size, type, norm, off] of list) {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, type, norm, stride, off);
    if (divisor) gl.vertexAttribDivisor(loc, divisor);
  }
}

async function gunzip(buf) {
  const ds = new DecompressionStream("gzip");
  return new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer();
}
async function fetchBinary(url, signal) {
  const res = await fetch(url, { signal });
  if (!res.ok) throw new Error(res.status);
  // Browsers decode Content-Encoding: gzip themselves; fall back if not.
  const buf = await res.arrayBuffer();
  const head = new Uint8Array(buf, 0, 2);
  return head[0] === 0x1f && head[1] === 0x8b ? gunzip(buf) : buf;
}

async function loadTemplates() {
  const buf = await fetchBinary(`models/${meta.version}/${theme}.bin`);
  const u32 = new Uint32Array(buf);
  const count = u32[1];
  const out = new Map();
  let at = 2;
  for (let i = 0; i < count; i++) {
    const id = u32[at], verts = u32[at + 2];
    at += 3;
    const data = new Uint8Array(buf, at * 4, verts * 28);
    const rec = vao(() => {
      const b = buffer(gl.ARRAY_BUFFER, data);
      attribs(28, [[0, 3, gl.FLOAT, false, 0], [1, 3, gl.FLOAT, false, 12], [2, 4, gl.UNSIGNED_BYTE, true, 24]]);
      return [b];
    });
    out.set(id, { ...rec, verts });
    at += verts * 7;
  }
  return out;
}

// GTL2: see src/vtile.rs. Index width follows the vertex count.
// Columnar attributes: [location, size, type, normalized, bytes per vertex],
// each column padded to 4 bytes.
function columns(count, list) {
  let off = 0;
  for (const [loc, size, type, norm, bytes] of list) {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, type, norm, bytes, off);
    off += (count * bytes + 3) & ~3;
  }
}
const COLUMNS = { fill: [4, 4], line: [6, 2, 4, 4, 4, 2], mesh: [6, 2, 4, 2, 1] };
const columnBytes = (count, cols) => cols.reduce((a, c) => a + ((count * c + 3) & ~3), 0);

function parseTile(buf) {
  const dv = new DataView(buf);
  let at = 4;
  const bg = dv.getUint32(at, true); at += 4;
  const align = () => { at = (at + 3) & ~3; };
  const section = (cols) => {
    const v = dv.getUint32(at, true), i = dv.getUint32(at + 4, true); at += 8;
    const n = columnBytes(v, cols);
    const verts = new Uint8Array(buf, at, n); at += n;
    const idx = v < 65536 ? new Uint16Array(buf, at, i) : new Uint32Array(buf, at, i);
    at += idx.byteLength; align();
    return { v, i, verts, idx };
  };
  const fills = section(COLUMNS.fill), lines = section(COLUMNS.line), meshes = section(COLUMNS.mesh);
  const n = dv.getUint32(at, true); at += 4;
  const inst = new Float32Array(buf, at, n * 6);
  const instU = new Uint32Array(buf, at, n * 6);
  return { fills, lines, meshes, n, inst, instU, bg };
}

const indexType = (idx) => idx instanceof Uint16Array ? gl.UNSIGNED_SHORT : gl.UNSIGNED_INT;
function upload(t, d) {
  // A background quad goes first, merged into both fill columns.
  const nv = d.fills.v, fv = new Uint8Array(columnBytes(nv + 4, COLUMNS.fill));

  theme = theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
  $("themeIcon").innerHTML = theme === "light" ? MOON_ICON : SUN_ICON;
  $("theme").title = $("theme").ariaLabel = theme === "light" ? "Dark theme" : "Light theme";
  generation++;
  for (const t of tiles.values()) { t.ctrl.abort(); freeTile(t); }
  tiles.clear();
  templates = await loadTemplates();
  redraw();
};

// ---- Start ----------------------------------------------------------------
if (!readHash()) {
  view.x = (bx0 + bx1) / 2; view.y = (by0 + by1) / 2;
}
resize();
if (!location.hash) view.z = fitZoom() + 0.3;
templates = await loadTemplates();
redraw();
requestAnimationFrame(loop);
</script>
</body>
</html>
