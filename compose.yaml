# MAP=./nyc.osm.pbf docker compose up --build
# The map lives in memory: NYC peaks near 3 GB loading, then about 1.7 GB plus cache.
services:
  maps:
    build: .
    image: maps:latest
    ports:
      - "8080:8080"
    volumes:
      - ${MAP:-./jfk.osm.pbf}:/data/map.osm.pbf:ro
    command: ["serve", "/data/map.osm.pbf", "--addr", "0.0.0.0:8080", "--cache-mb", "1024"]
    deploy:
      resources:
        limits:
          memory: 4g
    stop_grace_period: 10s
    restart: unless-stopped
    # No shell in the image; probe GET /health externally.
