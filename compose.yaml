# Usage: MAP=./nyc.osm.pbf docker compose up --build
# The whole map is held in memory: the NYC extract peaks near 3 GB while loading,
# then serves from about 1.7 GB
# plus the tile cache (--cache-mb). Small extracts (jfk.osm.pbf) need far less.
services:
  maps:
    build: .
    image: maps:latest
    ports:
      - "8080:8080"
    volumes:
      - ${MAP:-./jfk.osm.pbf}:/data/map.osm.pbf:ro
    command: ["serve", "/data/map.osm.pbf", "--addr", "0.0.0.0:8080", "--cache-mb", "1024"]
    deploy:
      resources:
        limits:
          memory: 4g
    stop_grace_period: 10s
    restart: unless-stopped
    # No healthcheck here: the distroless image has no shell or curl.
    # Probe GET http://<host>:8080/health (returns "ok") externally.
