[package]
name = "maps"
version = "0.2.0"
edition = "2021"
description = "A fast, parallel OpenStreetMap renderer: .osm.pbf in, map tiles and posters out."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
osmpbf = "0.3.8"
png = "0.18"
rayon = "1.10"
rstar = "0.13"
rustc-hash = "2"
tiny-skia = "0.12"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"
